<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#ffffff" />
    <title>Time Tracker</title>
    
    <!-- PWA meta tags -->
    <meta name="description" content="Study Tracker for JEE Aspirants & Students - Works Offline" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Study Tracker" />
    
    <!-- Offline support styles -->
    <style>
      .offline-indicator {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        background: #ff6b6b;
        color: white;
        text-align: center;
        padding: 8px;
        font-size: 14px;
        z-index: 9999;
        transform: translateY(-100%);
        transition: transform 0.3s ease;
      }
      .offline-indicator.show {
        transform: translateY(0);
      }
      
      /* Loading fallback */
      .loading-fallback {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        font-family: system-ui, -apple-system, sans-serif;
        background: #ffffff;
        color: #000000;
      }
      
      @media (prefers-color-scheme: dark) {
        .loading-fallback {
          background: #000000;
          color: #ffffff;
        }
      }
      
      .spinner {
        width: 40px;
        height: 40px;
        border: 4px solid #f3f3f3;
        border-top: 4px solid #3498db;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-right: 16px;
      }
      
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <!-- Offline indicator -->
    <div id="offline-indicator" class="offline-indicator">
      📱 You're offline - App continues to work normally
    </div>
    
    <!-- Loading fallback -->
    <div id="loading-fallback" class="loading-fallback">
      <div class="spinner"></div>
      <div>Loading Study Tracker...</div>
    </div>
    
    <div id="root" class="contents"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Offline functionality -->
    <script>
      // Hide loading fallback once React loads
      window.addEventListener('DOMContentLoaded', () => {
        setTimeout(() => {
          const loadingEl = document.getElementById('loading-fallback');
          if (loadingEl) {
            loadingEl.style.display = 'none';
          }
        }, 2000);
      });
      
      // Offline/online detection
      const offlineIndicator = document.getElementById('offline-indicator');
      
      function updateOnlineStatus() {
        if (navigator.onLine) {
          offlineIndicator.classList.remove('show');
          console.log('Back online');
          document.title = 'Study Tracker';
        } else {
          offlineIndicator.classList.add('show');
          console.log('Gone offline - app will continue to work');
          document.title = 'Study Tracker (Offline)';
        }
      }
      
      // Initial check
      updateOnlineStatus();
      
      // Listen for online/offline events
      window.addEventListener('online', updateOnlineStatus);
      window.addEventListener('offline', updateOnlineStatus);
      
      // Auto-hide offline indicator after 5 seconds
      window.addEventListener('offline', () => {
        setTimeout(() => {
          if (!navigator.onLine) {
            offlineIndicator.classList.remove('show');
          }
        }, 5000);
      });
    </script>
  </body>
</html>
